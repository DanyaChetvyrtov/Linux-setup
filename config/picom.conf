# Picom 13+. Supports XFWM or BSPWM; panels keep their GTK styling.
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = false;
fading = false;
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.22;
shadow-offset-x = -8;
shadow-offset-y = -8;
blur-background = false;
corner-radius = 8;

# The gesture helper sets this property only around a workspace switch.
# Every window travels the same monitor width, so the workspace moves together.
rules = (
  {
    match = "(window_type = 'normal' || window_type = 'dialog') && _KALI_WORKSPACE_DIRECTION@ = 1";
    animations = (
      {
        triggers = ["show", "open"];
        offset-x = { duration = 0.18; start = "window-monitor-width"; end = 0;
                     curve = "cubic-bezier(0.22, 1, 0.36, 1)"; };
        shadow-offset-x = "offset-x";
        opacity = "window-raw-opacity";
      },
      {
        triggers = ["hide"];
        offset-x = { duration = 0.18; start = 0; end = "0 - window-monitor-width";
                     curve = "cubic-bezier(0.22, 1, 0.36, 1)"; };
        shadow-offset-x = "offset-x";
        opacity = { duration = 0.18; start = "window-raw-opacity-before";
                    end = "window-raw-opacity-before"; };
        shadow-opacity = 0.22;
      }
    );
  },
  {
    match = "(window_type = 'normal' || window_type = 'dialog') && _KALI_WORKSPACE_DIRECTION@ = 2";
    animations = (
      {
        triggers = ["show", "open"];
        offset-x = { duration = 0.18; start = "0 - window-monitor-width"; end = 0;
                     curve = "cubic-bezier(0.22, 1, 0.36, 1)"; };
        shadow-offset-x = "offset-x";
        opacity = "window-raw-opacity";
      },
      {
        triggers = ["hide"];
        offset-x = { duration = 0.18; start = 0; end = "window-monitor-width";
                     curve = "cubic-bezier(0.22, 1, 0.36, 1)"; };
        shadow-offset-x = "offset-x";
        opacity = { duration = 0.18; start = "window-raw-opacity-before";
                    end = "window-raw-opacity-before"; };
        shadow-opacity = 0.22;
      }
    );
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Xfce4-panel'";
    shadow = false;
    corner-radius = 0;
  },
  # BEGIN kali-setup dock motion
  {
    # Main dock window only: the 28px top bar and 3px edge sensor do not match.
    # XFCE moves the dock to hide/reveal it, rather than unmapping its window.
    match = "class_g = 'Xfce4-panel' && role = 'Panel' && height > 40";
    animations = (
      {
        triggers = ["position"];
        offset-x = { duration = 0.22; start = "window-x-before - window-x"; end = 0;
                     curve = "cubic-bezier(0.22, 1, 0.36, 1)"; };
        offset-y = { duration = 0.22; start = "window-y-before - window-y"; end = 0;
                     curve = "cubic-bezier(0.22, 1, 0.36, 1)"; };
        opacity = "window-raw-opacity";
      }
    );
  }
  # END kali-setup dock motion
);
